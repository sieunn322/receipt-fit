<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>レシピート – Receipt + Fit!</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--primary:#0066cc;--focus:#0071e3;--sky:#2997ff;--white:#fff;--parch:#f5f5f7;--t1:#272729;--t2:#2a2a2c;--black:#000;--ink:#1d1d1f;--ink48:#7a7a7a;--muted:#ccc;--hair:#e0e0e0;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Noto Sans JP","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:96px}
body{font-family:var(--font);font-size:17px;line-height:1.47;letter-spacing:-.374px;color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#gnav{background:var(--black);height:44px;padding:env(safe-area-inset-top,0px) 22px 0;box-sizing:content-box;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:12px;letter-spacing:-.12px;position:sticky;top:0;z-index:20}
#gnav b{font-weight:600;font-size:14px}
.lang{background:none;border:0;color:#fff;font-size:12px;padding:8px 4px}
#snav{position:sticky;top:calc(44px + env(safe-area-inset-top,0px));z-index:19;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 22px;background:rgba(245,245,247,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.tripbtn{background:none;border:0;font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19;max-width:62vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0;text-align:left}
.pill{background:var(--primary);color:#fff;border:0;border-radius:9999px;padding:11px 22px;line-height:1.2;transition:transform .12s}
.pill.s{padding:7px 16px;font-size:14px;letter-spacing:-.224px;white-space:nowrap}
.pill.g{background:transparent;color:var(--primary);border:1px solid var(--primary)}
.pill:active,.chip:active,.opt:active{transform:scale(.95)}
.tl{background:none;border:0;color:var(--primary);padding:8px 8px;font-size:17px}
.tl.d{color:var(--sky)}
.tile{padding:80px 22px;text-align:center}
.tile.l{background:var(--white)}.tile.p{background:var(--parch)}.tile.d{background:var(--t1);color:#fff}
.in{max-width:980px;margin:0 auto}
.hero{font-size:clamp(34px,8vw,56px);font-weight:600;line-height:1.07;letter-spacing:-.28px}
.disp{font-size:clamp(28px,6vw,40px);font-weight:600;line-height:1.1;letter-spacing:0}
.lead{font-size:clamp(21px,4vw,28px);line-height:1.14;letter-spacing:.196px;margin-top:12px}
.tag{font-size:21px;font-weight:600;letter-spacing:.231px;line-height:1.19}
.cap{font-size:14px;letter-spacing:-.224px;color:var(--ink48)}
.d .cap{color:var(--muted)}
.ctas{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-top:40px}
.card{background:var(--white);border:1px solid var(--hair);border-radius:18px;padding:24px;text-align:left}
.card.dk{background:var(--t2);border-color:#3a3a3c;color:#fff}
.card b{font-weight:600}
.card .v{font-size:28px;font-weight:600;letter-spacing:0;margin-top:6px;display:block}
.track{height:6px;background:#48484a;border-radius:9999px;margin:34px auto 12px;max-width:560px;overflow:hidden}
.track div{height:100%;background:var(--sky)}
.list{max-width:640px;margin:36px auto 0;text-align:left}
.li{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.li small{display:block;font-size:14px;color:var(--ink48);letter-spacing:-.224px}
.li b{font-weight:600;white-space:nowrap}
.fine{font-size:12px;letter-spacing:-.12px;color:var(--ink48)}
.flow{max-width:560px;margin:0 auto;text-align:left}
.flow .disp{text-align:center;margin-bottom:6px}
.surf{background:var(--parch);border-radius:18px;padding:36px 20px;display:flex;justify-content:center;align-items:center;min-height:320px;margin-top:28px}
.surf img{max-width:100%;max-height:300px;border-radius:8px;box-shadow:rgba(0,0,0,.22) 3px 5px 30px 0}
.surf video{width:100%;max-height:440px;border-radius:12px;object-fit:cover;background:#000}
.chip{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--white);border:1px solid var(--hair);border-radius:9999px;padding:14px 22px;margin-top:12px;transition:transform .12s;font-size:17px}
.chip.sel{border:2px solid var(--focus);padding:13px 21px}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink48)}
.sel .dot{border:5px solid var(--focus)}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{background:var(--white);border:1px solid var(--hair);border-radius:9999px;padding:10px 18px;transition:transform .12s}
.opt.sel{border:2px solid var(--focus);padding:9px 17px}
.tcard{flex:1;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--white);border:1px solid var(--hair);border-radius:18px;padding:18px 22px;margin-top:12px}
.tcard.sel{border:2px solid var(--focus);padding:17px 21px}
label{display:block;font-size:14px;letter-spacing:-.224px;color:var(--ink48);margin:20px 0 6px 14px}
input,select{width:100%;height:44px;border:1px solid rgba(0,0,0,.08);outline:1px solid var(--hair);border-radius:9999px;padding:0 20px;background:var(--white);appearance:none;-webkit-appearance:none}
.it{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;margin-bottom:8px}
.x{background:none;border:0;color:var(--ink48);font-size:16px;padding:8px}
.sum{display:flex;justify-content:space-between;align-items:baseline;margin-top:26px;padding:0 14px}
.sum span:last-child{font-size:34px;font-weight:600;letter-spacing:0}
.flow .pill{width:100%;margin-top:24px;font-size:17px;padding:14px}
.back{margin-bottom:10px}
footer{background:var(--parch);padding:32px 22px calc(32px + env(safe-area-inset-bottom,0px));text-align:center}
@keyframes pu{50%{opacity:.35}}
.busy{animation:pu 1.3s infinite}
@media (prefers-reduced-motion:reduce){.pill,.chip,.opt{transition:none}.busy{animation:none}}
@media (max-width:480px){.tile{padding:56px 20px}}
</style>
</head>

+'<section class="tile d"><div class="in"><h2 class="disp">'+t('iD')+'</h2><div class="grid">'+[['cash',30000],['wow',70000],['card',50000]].map(function(x){return '<div class="card dk"><b>'+t(x[0])+'</b><span class="v">'+w(x[1])+'</span></div>'}).join('')+'</div><p class="lead" style="margin-top:32px" aria-hidden="true">↓</p><p class="hero" id="cu" style="margin-top:8px">'+w(150000)+'</p><p class="cap" style="margin-top:8px">'+t('total')+' · '+t('ill')+'</p></div></section>'
+'<section class="tile p"><div class="in"><div class="grid" style="margin-top:0">'+steps+'</div></div></section>'
+'<section class="tile l"><div class="in"><div class="grid" style="margin-top:0">'+feats+'</div></div></section>'
+'<section class="tile d"><div class="in"><h2 class="disp">'+t('iE')+'</h2><div class="ctas"><button class="pill" data-a="start">'+t('start')+'</button></div></div></section>';
countUp()}
function newTrip(){
var opts=REG.map(function(r){return '<button class="opt'+(NT.regions.indexOf(r[0])>-1?' sel':'')+'" data-a="tr" data-k="'+r[0]+'">'+r[L=='ja'?1:2]+'</button>'}).join('');
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="'+(S.trips.length?'trips':'intro')+'">'+t('back')+'</button><h1 class="disp">'+t('newT')+'</h1><p class="cap" style="text-align:center;margin-top:6px">'+t('pickR')+'</p><div class="opts" style="margin-top:24px">'+opts+'</div><label>'+t('other')+'</label><input id="ntc" value="'+esc(NT.custom)+'" placeholder="'+t('otherPh')+'"><label>'+t('budget')+' (₩)</label><input id="ntb" type="number" inputmode="numeric" value="'+NT.budget+'">'+(NT.err?'<p class="cap" style="margin:14px 14px 0">'+t('needR')+'</p>':'')+'<button class="pill" data-a="mk">'+t('create')+'</button></div></section>'}
function readNT(){var c=document.getElementById('ntc'),b=document.getElementById('ntb');if(c)NT.custom=c.value;if(b&&+b.value>0)NT.budget=+b.value}
function trips(){
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="'+(cur()?'home':'intro')+'">'+t('back')+'</button><h1 class="disp">'+t('tripsT')+'</h1>'
+S.trips.map(function(tr){return '<div style="display:flex;gap:4px;align-items:center"><button class="tcard'+(tr.id==S.cur?' sel':'')+'" data-a="pick" data-id="'+tr.id+'"><span>'+esc(tripName(tr))+'<br><span class="cap">'+tr.tx.length+t('tn')+'</span></span><b style="font-weight:600">'+w(tsum(tr))+'</b></button><button class="x" data-a="tdel" data-id="'+tr.id+'" aria-label="delete">✕</button></div>'}).join('')
+'<button class="pill" data-a="start">'+t('newTrip')+'</button></div></section>'}
function home(){
var tr=cur(),tot=sum(),rem=tr.budget-tot,pct=Math.min(100,Math.max(0,tot/tr.budget*100)),td=sum(function(x){return x.date==TODAY});
var cards=['cash','wow','card'].map(function(m){return '<div class="card"><b>'+t(m)+'</b><span class="v">'+w(sum(function(x){return x.m==m}))+'</span></div>'}).join('')+'<div class="card"><b>'+t('today')+'</b><span class="v">'+w(td)+'</span></div>';
var list=tr.tx.slice().reverse().map(function(x){return '<div class="li"><span>'+esc(x.store)+'<small>'+x.date+' · '+t('cats')[x.cat]+' · '+t(x.m)+'</small></span><b>'+w(x.total)+'</b></div>'}).join('')||'<p class="cap" style="text-align:center;padding:20px 0">'+t('empty')+'</p>';
v.innerHTML='<section class="tile l"><div class="in"><p class="tag">'+t('total')+'</p><h1 class="hero" style="margin-top:8px">'+w(tot)+'</h1><p class="cap" style="margin-top:8px;font-size:17px">≈ '+jy(tot)+'</p><p class="lead">'+t('tl')+'</p><div class="ctas"><button class="pill" data-a="scan">'+t('scan')+'</button><button class="pill g" data-a="manual">'+t('manual')+'</button></div></div></section>'
+'<section class="tile d"><div class="in"><p class="tag">'+t('remain')+(rem<0?' · '+t('over'):'')+'</p><h2 class="disp" style="font-size:clamp(34px,8vw,56px);margin-top:8px">'+w(rem)+'</h2><p class="cap" style="margin-top:6px;font-size:17px">≈ '+jy(rem)+'</p><div class="track"><div style="width:'+pct+'%"></div></div><p class="cap">'+t('budget')+' '+w(tr.budget)+'</p><button class="tl d" data-a="bud">'+t('chg')+'</button></div></section>'
+fxTile()
+'<section class="tile p"><div class="in"><h2 class="disp">'+t('by')+'</h2><div class="grid">'+cards+'</div></div></section>'
+'<section class="tile l"><div class="in"><h2 class="disp">'+t('recent')+'</h2><p class="cap" style="margin-top:6px">'+tr.tx.length+t('tn')+'</p><div class="list">'+list+'</div></div></section>'
+'<footer><button class="tl" data-a="intro">'+t('about')+'</button></footer>'}
var PROMPT='This image is a photo of a shop receipt from Korea (text may be Korean, English or Japanese). Read it carefully and reply with ONLY one JSON object and no other text: {"store": shop name as printed (string), "date": purchase date as YYYY-MM-DD or empty string if unreadable, "category": integer where 0=cafe, 1=restaurant or meal, 2=shopping or groceries, 3=transport, 4=other, "items": [{"n": item name as printed, "p": line price in KRW as an integer (quantity times unit price, no currency symbol)}], "total": the final amount paid in KRW as an integer}. Rules: never invent values; use empty string or 0 for anything you cannot read; if the image is not a receipt reply {"error":"not_receipt"}.';
function stopCam(){if(stream){stream.getTracks().forEach(function(k){k.stop()});stream=null}}
function camFail(er){var st=document.getElementById('st');if(st&&!busy)st.textContent=t('camErr')+(er&&er.name?' ('+er.name+')':'')}
function startCam(){var vd=document.getElementById('cv');if(!vd)return;
if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia))return camFail();
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false}).then(function(s){
var el=document.getElementById('cv');if(scr!='scan'||!el||busy){s.getTracks().forEach(function(k){k.stop()});return}
stream=s;el.srcObject=s;el.hidden=false;var ph=document.getElementById('ph');if(ph)ph.hidden=true;var st=document.getElementById('st');if(st&&!scanMsg)st.textContent=t('shot')}).catch(camFail)}
function capture(){var vd=document.getElementById('cv');
if(!stream||!vd||!vd.videoWidth){document.getElementById('f').click();return}
var c=document.createElement('canvas'),k=Math.min(1,1600/Math.max(vd.videoWidth,vd.videoHeight));c.width=Math.round(vd.videoWidth*k);c.height=Math.round(vd.videoHeight*k);
c.getContext('2d').drawImage(vd,0,0,c.width,c.height);c.toBlob(function(b){if(b)analyze(b)},'image/jpeg',.88)}
function analyze(b){if(busy)return;busy=true;scanMsg='';stopCam();var r=new FileReader();r.onload=function(){photo=r.result;render();run(b)};r.readAsDataURL(b)}
function norm(j){var it=(Array.isArray(j.items)?j.items:[]).map(function(x){return{n:String(x.n||''),p:Math.round(+x.p||0)}}).filter(function(x){return x.n||x.p});
var tot=Math.round(+j.total||0);if(!it.length&&tot>0)it=[{n:String(j.store||''),p:tot}];
var c=Math.round(+j.category);if(!(c>=0&&c<=4))c=4;
return{date:/^\d{4}-\d{2}-\d{2}$/.test(j.date||'')?j.date:TODAY,store:String(j.store||''),cat:c,items:it.length?it:[{n:'',p:0}],m:'cash',photo:1,rt:tot}}
function run(b){
var fin=function(d,msg){busy=false;if(d){D=d;scr='pay'}else{photo=null;scanMsg=msg;scr='scan'}render()};
var p=(window.claude&&claude.use)?claude.use('sample'):Promise.resolve(null);
p.then(function(sm){if(!sm)throw{code:'none'};return sm.limits().then(function(l){if(!l||!l.images)throw{code:'none'};return sm.json(PROMPT,{images:[b]})})})
.then(function(j){if(!j||j.error)return fin(null,t('aiNot'));fin(norm(j))})
.catch(function(e){var c=e&&e.code;fin(null,(c=='none'||c=='not_granted'||c=='images_unavailable'||c=='not_declared'||c=='capability_disabled')?t('aiNo'):t('aiFail'))})}
function scan(){var msg=busy?t('ai'):(scanMsg||t('shot'));
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="home">'+t('back')+'</button><h1 class="disp">'+t('scan')+'</h1><p class="cap'+(busy?' busy':'')+'" id="st" style="text-align:center;margin-top:6px">'+msg+'</p><div class="surf">'+(photo?'<img src="'+photo+'" alt="">':'<video id="cv" playsinline muted autoplay hidden></video><p class="cap" id="ph">'+t('cam')+'</p>')+'</div><input type="file" id="f" accept="image/*" capture="environment" hidden><input type="file" id="g" accept="image/*" hidden>'
+(busy?'':'<label class="pill" for="f" data-a="shoot" style="display:block;text-align:center;cursor:pointer">'+t('shoot')+'</label><label class="pill g" for="g" style="display:block;text-align:center;margin-top:12px;cursor:pointer">'+t('gal')+'</label><div style="text-align:center;margin-top:8px"><button class="tl" data-a="manual">'+t('manual')+'</button></div>')
+'<p class="fine" style="text-align:center;margin-top:16px">'+t('aiNote')+'</p></div></section>';
var oc=function(e){var fl=e.target.files[0];if(fl)analyze(fl)};document.getElementById('f').onchange=oc;document.getElementById('g').onchange=oc}
function pay(){
var tot=D.items.reduce(function(a,i){return a+i.p},0);
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="scan">'+t('back')+'</button><h1 class="disp">'+t('pickpay')+'</h1><div class="surf" style="min-height:0;padding:24px;justify-content:space-between;text-align:left"><span><b style="font-weight:600">'+esc(D.store)+'</b><br><span class="cap">'+D.date+'</span></span><span class="tag">'+w(tot)+'</span></div>'
+['cash','wow','card'].map(function(m){return '<button class="chip'+(D.m==m?' sel':'')+'" data-a="m" data-m="'+m+'"><span>'+t(m)+'</span><span class="dot"></span></button>'}).join('')
+'<p class="cap" style="text-align:center;margin-top:20px">'+t('addTo')+'</p><button class="pill" data-a="toConfirm">'+t('next')+'</button></div></section>'}
function confirm_(){
var tot=D.items.reduce(function(a,i){return a+(+i.p||0)},0);
v.innerHTML='<section class="tile l"><div class="flow"><button class="tl back" data-a="pay">'+t('back')+'</button><h1 class="disp">'+t('check')+'</h1><p class="cap" style="text-align:center;margin-top:6px">'+t('fix')+'</p>'+(D.photo&&photo?'<div class="surf" style="min-height:0;padding:18px"><img src="'+photo+'" alt="" style="max-height:130px"></div>':'')
+'<label>'+t('date')+'</label><input type="date" id="d" value="'+D.date+'"><label>'+t('store')+'</label><input id="s" value="'+esc(D.store)+'"><label>'+t('cat')+'</label><select id="c">'+t('cats').map(function(c,i){return '<option value="'+i+'"'+(i==D.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select><label>'+t('items')+'</label>'
+D.items.map(function(it,i){return '<div class="it"><input data-i="'+i+'" data-k="n" value="'+esc(it.n)+'" placeholder="'+t('iname')+'"><input data-i="'+i+'" data-k="p" type="number" inputmode="numeric" value="'+it.p+'"><button class="x" data-a="del" data-i="'+i+'" aria-label="delete">✕</button></div>'}).join('')
+'<button class="tl" data-a="addIt">'+t('add')+'</button>'+(D.rt&&D.rt!=tot?'<p class="cap" style="margin:10px 14px 0">'+t('mis')+' '+w(D.rt)+'</p>':'')+'<div class="sum"><span>'+t('sum')+' · '+t(D.m)+'</span><span id="tt">'+w(tot)+'</span></div><button class="pill" data-a="save">'+t('save')+'</button></div></section>'}
function readForm(){var g=function(i){return document.getElementById(i)};if(!g('s'))return;D.date=g('d').value||TODAY;D.store=g('s').value;D.cat=+g('c').value}
v.addEventListener('input',function(e){var i=e.target.dataset.i;if(i==null)return;D.items[i][e.target.dataset.k]=e.target.dataset.k=='p'?+e.target.value:e.target.value;var tt=document.getElementById('tt');if(tt)tt.textContent=w(D.items.reduce(function(a,x){return a+(+x.p||0)},0))});
document.addEventListener('input',function(e){var id=e.target.id,o;if(id=='cj'){o=document.getElementById('ck');o.value=e.target.value?Math.round(e.target.value*R.r):''}else if(id=='ck'){o=document.getElementById('cj');o.value=e.target.value?Math.round(e.target.value/R.r):''}});
document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;
if(scr=='new')readNT();
if(a=='home'){photo=null;scr='home'}
else if(a=='intro'){scr='intro'}
else if(a=='cont'){scr='home'}
else if(a=='start'){NT={regions:[],custom:'',budget:300000,err:false};scr='new'}
else if(a=='tr'){var k=b.dataset.k,ix=NT.regions.indexOf(k);if(ix>-1)NT.regions.splice(ix,1);else NT.regions.push(k);NT.err=false}
else if(a=='mk'){if(!NT.regions.length&&!NT.custom.trim()){NT.err=true}else{var id=Date.now();S.trips.push({id:id,regions:NT.regions.slice(),custom:NT.custom.trim(),budget:NT.budget>0?NT.budget:300000,tx:[]});S.cur=id;sv();scr='home'}}
else if(a=='trips'){scr='trips'}
else if(a=='pick'){S.cur=+b.dataset.id;sv();scr='home'}
else if(a=='tdel'){var did=+b.dataset.id;if(!confirm(t('delq')))return;S.trips=S.trips.filter(function(x){return x.id!=did});if(S.cur==did)S.cur=S.trips.length?S.trips[0].id:null;sv();if(!S.trips.length)scr='intro'}
else if(a=='scan'){photo=null;scanMsg='';scr='scan'}
else if(a=='manual'){photo=null;D={date:TODAY,store:'',cat:1,items:[{n:'',p:0}],m:'cash'};scr='pay'}
else if(a=='shoot'){if(stream){e.preventDefault();capture()}return}
else if(a=='m'){D.m=b.dataset.m}
else if(a=='toConfirm'){scr='confirm'}
else if(a=='pay'){readForm();scr='pay'}
else if(a=='del'){readForm();D.items.splice(+b.dataset.i,1);if(!D.items.length)D.items.push({n:'',p:0})}
else if(a=='addIt'){readForm();D.items.push({n:'',p:0})}
else if(a=='save'){readForm();var tot=D.items.reduce(function(s,x){return s+(+x.p||0)},0);if(tot>0){cur().tx.push({id:Date.now(),date:D.date,store:D.store||'—',cat:D.cat,items:D.items.filter(function(x){return x.n||x.p}),total:tot,m:D.m});sv();photo=null;scr='home'}else return}
else if(a=='bud'){var n=prompt(t('budq'),cur().budget);if(n&&+n>0){cur().budget=+n;sv()}}
else if(a=='fx'){fetchRate();return}
else if(a=='fxset'){var n2=prompt(t('fxq'),(R.r*100).toFixed(1));if(n2&&+n2>0){R={r:+n2/100,live:false,at:Date.now(),src:'manual',busy:false};saveR()}}
else return;
var y0=window.scrollY;render();if(a=='tr'||a=='m'||a=='addIt'||a=='del')window.scrollTo(0,y0)});
document.getElementById('lang').onclick=function(){readForm();readNT();L=L=='ja'?'ko':'ja';render()};
render();fetchRate();
</script>
